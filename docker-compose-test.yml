services:
  postgres_test:
    image: postgis/postgis:15-3.3
    restart: always
    volumes:
      - db_data_test:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  graphql-engine-test:
    image: hasura/graphql-engine:v2.47.0
    ports:
      - "${TEST_HASURA_PORT:-8081}:8080"
    restart: always
    environment:
      # NOTE: TEST_POSTGRES_PASSWORD must be URI-safe (no @, /, :, ?) — see .env.test.example
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres
      PG_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
    depends_on:
      postgres_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - test-network

  hasura-cli-test:
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    volumes:
      - .:/app
    environment:
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine-test:8080
      PG_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres
      HASURA_ADMIN_SECRET: ${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
      CONSOLE_PORT: 9696
    working_dir: /app
    ports:
      - "9696:9696"
    depends_on:
      graphql-engine-test:
        condition: service_healthy
    networks:
      - test-network

  webhook:
    ports:
      - "${TEST_WEBHOOK_PORT:-3001}:3001"
    build:
      context: .
      dockerfile: webhook/Dockerfile
      cache_from:
        - type=local,src=.docker-cache/webhook
      cache_to:
        - type=local,dest=.docker-cache/webhook,mode=max
    environment:
      - NODE_ENV=test
      - WEBHOOK_PORT=3001
      - HASURA_ADMIN_SECRET=${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
      - HASURA_GRAPHQL_ENDPOINT=http://graphql-engine-test:8080/v1/graphql
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-postgrespassword}
      - USE_MOCK_DATA=true
      - TRUSTLESSWORK_WEBHOOK_SECRET=${TEST_WEBHOOK_SECRET:-dev-secret}
      # The x402 Karate suite exercises the enabled payment gate. Settlement is
      # still disabled so tests never call a facilitator /settle endpoint.
      - X402_ENABLED=true
      - X402_SETTLE_ENABLED=false
    depends_on:
      postgres_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - test-network


  karate:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      baseUrl: http://graphql-engine-test:8080/v1/graphql
      webhookUrl: http://webhook:3001
      HASURA_ADMIN_SECRET: ${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
      JWT_SECRET: ${TEST_JWT_SECRET:-testsecret}
      TRUSTLESSWORK_WEBHOOK_SECRET: ${TEST_WEBHOOK_SECRET:-dev-secret}
    command: >
      java -cp /app/tests/karate.jar:/app/tests/postgresql-jdbc.jar:/app/tests/karate/src/test/resources
      com.intuit.karate.Main
      --configdir /app/tests/karate/src/test/resources
      --tags ~@ignore --tags ~@timing
      tests/karate/features
    volumes:
      - ./tests/results:/app/target/karate-reports
      - ./tests/results:/app/tests/results
    depends_on:
      postgres_test:
        condition: service_healthy
      webhook:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
      graphql-engine-test:
        condition: service_healthy
    networks:
      - test-network

  migrate-test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine-test:8080
      HASURA_ADMIN_SECRET: ${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:?Set TEST_ADMIN_SECRET or run bin/test}
    working_dir: /app
    command: ["bash", "bin/prepare-test-db"]
    depends_on:
      graphql-engine-test:
        condition: service_started
    networks:
      - test-network

volumes:
  db_data_test:

networks:
  test-network:
    driver: bridge
