services:
  postgres_test:
    image: postgis/postgis:15-3.3
    restart: always
    volumes:
      - db_data_test:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${TEST_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  graphql-engine-test:
    image: hasura/graphql-engine:v2.47.0
    ports:
      - "${TEST_HASURA_PORT:-8081}:8080"
    restart: always
    environment:
      # NOTE: TEST_POSTGRES_PASSWORD must be URI-safe (no @, /, :, ?) — see .env.test.example
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres
      PG_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:-myadminsecretkey}
    depends_on:
      postgres_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - test-network

  hasura-cli-test:
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    volumes:
      - .:/app
    environment:
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine-test:8080
      PG_DATABASE_URL: postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:-myadminsecretkey}
      CONSOLE_PORT: 9696
    working_dir: /app
    ports:
      - "9696:9696"
    depends_on:
      graphql-engine-test:
        condition: service_healthy
    networks:
      - test-network

  webhook:
    ports:
      - "${TEST_WEBHOOK_PORT:-3001}:3001"
    build:
      context: .
      dockerfile: webhook/Dockerfile
      cache_from:
        - type=local,src=.docker-cache/webhook
      cache_to:
        - type=local,dest=.docker-cache/webhook,mode=max
    environment:
      - NODE_ENV=test
      - WEBHOOK_PORT=3001
      - HASURA_GRAPHQL_ADMIN_SECRET=${TEST_ADMIN_SECRET:-myadminsecretkey}
      - HASURA_GRAPHQL_ENDPOINT=http://graphql-engine-test:8080/v1/graphql
      - POSTGRES_HOST=postgres_test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-postgrespassword}
      - USE_MOCK_DATA=true
      - TRUSTLESSWORK_WEBHOOK_SECRET=${TEST_WEBHOOK_SECRET:-dev-secret}
    depends_on:
      postgres_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - test-network


  karate:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      baseUrl: http://graphql-engine-test:8080/v1/graphql
      webhookUrl: http://webhook:3001
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:-myadminsecretkey}
      JWT_SECRET: ${TEST_JWT_SECRET:-testsecret}
      TRUSTLESSWORK_WEBHOOK_SECRET: ${TEST_WEBHOOK_SECRET:-dev-secret}
    command: >
      java -cp /app/tests/karate.jar:/app/tests/postgresql-jdbc.jar:/app/tests/karate/src/test/resources
      com.intuit.karate.Main
      --configdir /app/tests/karate/src/test/resources
      --tags ~@ignore
      tests/karate/features
    volumes:
      - ./tests/results:/app/target/karate-reports
      - ./tests/results:/app/tests/results
    depends_on:
      postgres_test:
        condition: service_healthy
      webhook:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully
      graphql-engine-test:
        condition: service_healthy
    networks:
      - test-network

  migrate-test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine-test:8080
      HASURA_GRAPHQL_ADMIN_SECRET: ${TEST_ADMIN_SECRET:-myadminsecretkey}
    working_dir: /app
    command: >
      sh -c "
        ELAPSED=0;
        until curl -fsS --connect-timeout 5 --max-time 5 http://graphql-engine-test:8080/healthz; do
          if [ $${ELAPSED} -ge 120 ]; then
            echo '[migrate-test] ❌ Hasura did not become healthy after 120s';
            exit 1;
          fi;
          echo '[migrate-test] Waiting for Hasura... ($${ELAPSED}s elapsed)';
          sleep 2;
          ELAPSED=$$((ELAPSED + 2));
        done;
        sleep 5;
        for TENANT in safetrust hotel_industry; do
          curl -s -X POST http://graphql-engine-test:8080/v1/metadata -H 'X-Hasura-Admin-Secret: ${TEST_ADMIN_SECRET:-myadminsecretkey}' -H 'Content-Type: application/json' -d '{\\\"type\\\": \\\"pg_add_source\\\", \\\"args\\\": {\\\"name\\\": \\\"'\\\"$${TENANT}\\\"'\\\", \\\"configuration\\\": {\\\"connection_info\\\": { \\\"database_url\\\": \\\"postgres://postgres:${TEST_POSTGRES_PASSWORD:-postgrespassword}@postgres_test:5432/postgres\\\", \\\"isolation_level\\\": \\\"read-committed\\\" } } } }';
        done;
        sleep 2;
        for TENANT in safetrust hotel_industry; do
          echo \\\"[migrate-test] 📂 Migrating tenant: $$TENANT\\\";
          MIGRATED=false;
          WAIT=2;
          for ATTEMPT in 1 2 3 4 5; do
            echo \\\"[migrate-test] attempt $$ATTEMPT/5 for $$TENANT...\\\";
            if hasura migrate apply --database-name \\\"$$TENANT\\\" --endpoint http://graphql-engine-test:8080 --admin-secret \\\"${TEST_ADMIN_SECRET:-myadminsecretkey}\\\"; then
              echo \\\"[migrate-test] ✅ Migrations applied for $$TENANT\\\";
              MIGRATED=true;
              break;
            fi;
            if [ \\\"$$ATTEMPT\\\" -lt 5 ]; then
              echo \\\"[migrate-test] ⚠️ Attempt $$ATTEMPT failed — retrying in $${WAIT}s\\\";
              sleep $$WAIT;
              WAIT=$$((WAIT * 2));
            fi;
          done;
          if [ \\\"$$MIGRATED\\\" = \\\"false\\\" ]; then
            echo \\\"[migrate-test] ❌ Migration failed for $$TENANT after 5 attempts\\\";
            exit 1;
          fi;
        done;
        cd metadata && ./setup-tenant.sh safetrust hotel_industry --endpoint http://graphql-engine-test:8080 --admin-secret \\\"${TEST_ADMIN_SECRET:-myadminsecretkey}\\\"
      "
    depends_on:
      graphql-engine-test:
        condition: service_started
    networks:
      - test-network

volumes:
  db_data_test:

networks:
  test-network:
    driver: bridge
