table:
  name: users
  schema: safetrust
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - email
        - display_name
        - avatar_url
        - created_at
        - updated_at
      filter:
        id:
          _eq: x-hasura-user-id
  - role: host
    permission:
      columns:
        - id
        - email
        - display_name
        - avatar_url
        - created_at
        - updated_at
        - is_host
      filter: {}
  - role: admin
    permission:
      columns:
        - id
        - email
        - display_name
        - avatar_url
        - created_at
        - updated_at
        - is_host
      filter: {}
update_permissions:
  - role: host
    permission:
      columns:
        - display_name
        - avatar_url
      filter:
        id:
          _eq: x-hasura-user-id
  - role: admin
    permission:
      columns:
        - email
        - display_name
        - avatar_url
        - is_host
      filter: {}
