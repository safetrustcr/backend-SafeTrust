table:
  name: users
  schema: safetrust
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - email
        - first_name
        - last_name
        - phone_number
        - country_code
        - location
        - role
        - last_seen
      filter:
        id:
          _eq: x-hasura-user-id
  - role: host
    permission:
      columns:
        - id
        - email
        - first_name
        - last_name
        - phone_number
        - country_code
        - location
        - role
        - last_seen
      filter:
        id:
          _eq: x-hasura-user-id
  - role: admin
    permission:
      columns: "*"
      filter: {}
update_permissions:
  - role: guest
    permission:
      columns:
        - first_name
        - last_name
        - phone_number
        - country_code
        - location
      filter:
        id:
          _eq: x-hasura-user-id
      check:
        id:
          _eq: x-hasura-user-id
  - role: host
    permission:
      columns:
        - first_name
        - last_name
        - phone_number
        - country_code
        - location
      filter:
        id:
          _eq: x-hasura-user-id
      check:
        id:
          _eq: x-hasura-user-id
