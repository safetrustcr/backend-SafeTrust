table:
  name: apartment_images
  schema: safetrust
  
object_relationships:
  - name: apartment
    using:
      foreign_key_constraint_on: apartment_id

select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - apartment_id
        - image_url
        - uploaded_at
      filter:
        apartment:
          _and:
            - deleted_at:
                _is_null: true
            - is_available:
                _eq: true
      comment: "Guests can view images for available apartments"
  - role: host
    permission:
      columns:
        - id
        - apartment_id
        - image_url
        - uploaded_at
      filter:
        apartment:
          _or:
            - owner_id:
                _eq: X-Hasura-User-Id
            - _and:
                - deleted_at:
                    _is_null: true
                - is_available:
                    _eq: true
      comment: "Hosts can view images for their apartments and available listings"
  - role: admin
    permission:
      columns: "*"
      filter:
        apartment:
          owner_id:
            _neq: ""
      comment: "Admins can view all apartment images"

insert_permissions:
  - role: host
    permission:
      check:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      columns:
        - apartment_id
        - image_url
      comment: "Hosts can upload images for their apartments"
  - role: admin
    permission:
      check:
        apartment:
          owner_id:
            _neq: ""
      columns:
        - apartment_id
        - image_url
      comment: "Admins can manage apartment images"

update_permissions:
  - role: host
    permission:
      columns:
        - image_url
      filter:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      check:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      comment: "Hosts can update their apartment images"
  - role: admin
    permission:
      columns:
        - image_url
      filter:
        apartment:
          owner_id:
            _neq: ""
      check:
        apartment:
          owner_id:
            _neq: ""
      comment: "Admins can update apartment images"

delete_permissions:
  - role: host
    permission:
      filter:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      comment: "Hosts can delete their apartment images"
  - role: admin
    permission:
      filter:
        apartment:
          owner_id:
            _neq: ""
      comment: "Admins can delete any apartment image"