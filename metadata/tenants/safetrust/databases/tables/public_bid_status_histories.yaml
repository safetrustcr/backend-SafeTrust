table:
  name: bid_status_histories
  schema: safetrust
object_relationships:
  - name: bid_request
    using:
      foreign_key_constraint_on: bid_request_id
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - bid_request_id
        - status
        - notes
        - changed_by
        - created_at
      filter:
        bid_request:
          tenant_id:
            _eq: X-Hasura-User-Id
      comment: "Guests can see status history for their own offers"
  - role: host
    permission:
      columns:
        - id
        - bid_request_id
        - status
        - notes
        - changed_by
        - created_at
      filter:
        bid_request:
          apartment:
            owner_id:
              _eq: X-Hasura-User-Id
      comment: "Hosts can see status history for bids on their apartments"
  - role: admin
    permission:
      columns: "*"
      filter:
        bid_request:
          apartment:
            owner_id:
              _neq: ""
      comment: "Admins can view all bid status histories in their tenant"
insert_permissions:
  - role: admin
    permission:
      check:
        bid_request:
          apartment:
            owner_id:
              _neq: ""
      columns:
        - bid_request_id
        - status
        - notes
      set:
        changed_by: X-Hasura-User-Id
      comment: "Admins can record bid status changes for bids in their tenant"
delete_permissions:
  - role: admin
    permission:
      filter:
        bid_request:
          apartment:
            owner_id:
              _neq: ""
      comment: "Admins can delete bid history entries in their tenant"
