table:
  schema: safetrust
  name: trustless_work_escrows
configuration:
  custom_name: trustless_work_escrows
  custom_column_names:
    contract_id: contractId
    escrow_type: escrowType
    asset_code: assetCode
    asset_issuer: assetIssuer
    escrow_metadata: escrowMetadata
    created_at: createdAt
    updated_at: updatedAt
    tenant_id: tenantId
array_relationships:
  - name: transactions
    using:
      foreign_key_constraint_on:
        table:
          schema: safetrust
          name: escrow_transactions
        column: escrow_id
  - name: reservations
    using:
      foreign_key_constraint_on:
        table:
          schema: safetrust
          name: reservations
        column: escrow_id
