table:
  schema: safetrust
  name: trustless_work_escrows
configuration:
  custom_name: trustless_work_escrows
  custom_column_names:
    contract_id: contractId
    escrow_type: escrowType
    asset_code: assetCode
    asset_issuer: assetIssuer
    ledger_seq: ledgerSeq
    tx_hash: txHash
    escrow_metadata: escrowMetadata
    created_at: createdAt
    updated_at: updatedAt
    tenant_id: tenantId
object_relationships:
  - name: reservation
    using:
      manual_configuration:
        remote_table:
          name: reservations
          schema: safetrust
        column_mapping:
          id: escrow_id
array_relationships:
  - name: transactions
    using:
      foreign_key_constraint_on:
        column: escrow_id
        table:
          name: escrow_transactions
          schema: safetrust
  - name: milestones
    using:
      foreign_key_constraint_on:
        column: escrow_id
        table:
          name: escrow_milestones
          schema: safetrust
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - contract_id
        - marker
        - approver
        - releaser
        - resolver
        - escrow_type
        - status
        - asset_code
        - asset_issuer
        - amount
        - balance
        - ledger_seq
        - network
        - tx_hash
        - escrow_metadata
        - created_at
        - updated_at
        - tenant_id
      filter:
        reservation:
          guest_id:
            _eq: X-Hasura-User-Id
    comment: "Guests can view escrows for their reservations"
  - role: host
    permission:
      columns:
        - id
        - contract_id
        - marker
        - approver
        - releaser
        - resolver
        - escrow_type
        - status
        - asset_code
        - asset_issuer
        - amount
        - balance
        - ledger_seq
        - network
        - tx_hash
        - escrow_metadata
        - created_at
        - updated_at
        - tenant_id
      filter:
        reservation:
          apartment:
            owner_id:
              _eq: X-Hasura-User-Id
    comment: "Hosts can view escrows for their apartments"
  - role: admin
    permission:
      columns: "*"
      filter: {}
    comment: "Admins can view all escrows"
