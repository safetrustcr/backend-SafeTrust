table:
  name: reservations
  schema: safetrust
configuration:
  custom_name: safetrust_reservations
  column_config:
    apartment_id:
      custom_name: apartmentId
    guest_id:
      custom_name: guestId
    escrow_id:
      custom_name: escrowId
    check_in_date:
      custom_name: checkInDate
    check_out_date:
      custom_name: checkOutDate
    total_amount:
      custom_name: totalAmount
    asset_code:
      custom_name: assetCode
    created_at:
      custom_name: createdAt
    updated_at:
      custom_name: updatedAt
    tenant_id:
      custom_name: tenantId
object_relationships:
  - name: apartment
    using:
      foreign_key_constraint_on: apartment_id
  - name: guest
    using:
      foreign_key_constraint_on: guest_id
  - name: escrow
    using:
      foreign_key_constraint_on: escrow_id