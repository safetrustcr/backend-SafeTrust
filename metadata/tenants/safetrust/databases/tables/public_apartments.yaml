table:
  name: apartments
  schema: safetrust
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - name
        - description
        - price
        - warranty_deposit
        - address
        - coordinates
        - bedrooms
        - bathrooms
        - capacity
        - max_guests
        - floor_area
        - furnished
        - pet_friendly
        - category
        - is_available
        - available_from
        - available_until
        - owner_id
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - is_available:
              _eq: true
  - role: host
    permission:
      columns:
        - id
        - name
        - description
        - price
        - warranty_deposit
        - address
        - coordinates
        - bedrooms
        - bathrooms
        - capacity
        - max_guests
        - floor_area
        - furnished
        - pet_friendly
        - category
        - is_available
        - available_from
        - available_until
        - owner_id
        - created_at
        - updated_at
        - deleted_at
      filter:
        _or:
          - owner_id:
              _eq: x-hasura-user-id
          - _and:
              - deleted_at:
                  _is_null: true
              - is_available:
                  _eq: true
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: host
    permission:
      check:
        owner_id:
          _eq: x-hasura-user-id
      columns:
        - name
        - description
        - price
        - warranty_deposit
        - address
        - coordinates
        - bedrooms
        - bathrooms
        - capacity
        - max_guests
        - floor_area
        - furnished
        - pet_friendly
        - category
        - is_available
        - available_from
        - available_until
      set:
        owner_id: x-hasura-user-id
update_permissions:
  - role: host
    permission:
      filter:
        _and:
          - owner_id:
              _eq: x-hasura-user-id
          - deleted_at:
              _is_null: true
      columns:
        - name
        - description
        - price
        - warranty_deposit
        - address
        - coordinates
        - bedrooms
        - bathrooms
        - capacity
        - max_guests
        - floor_area
        - furnished
        - pet_friendly
        - category
        - is_available
        - available_from
        - available_until
        - deleted_at
      check:
        owner_id:
          _eq: x-hasura-user-id
