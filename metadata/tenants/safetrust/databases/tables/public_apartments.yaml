table:
  name: apartments
  schema: safetrust
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - name
        - description
        - price
        - location
        - created_at
        - updated_at
        - host_id
      filter:
        host_id:
          _eq: x-hasura-user-id
  - role: host
    permission:
      columns:
        - id
        - name
        - description
        - price
        - location
        - created_at
        - updated_at
        - host_id
      filter:
        host_id:
          _eq: x-hasura-user-id
  - role: admin
    permission:
      columns:
        - id
        - name
        - description
        - price
        - location
        - created_at
        - updated_at
        - host_id
      filter: {}
insert_permissions:
  - role: host
    permission:
      check:
        host_id:
          _eq: x-hasura-user-id
      columns:
        - name
        - description
        - price
        - location
        - host_id
update_permissions:
  - role: host
    permission:
      filter:
        host_id:
          _eq: x-hasura-user-id
      columns:
        - name
        - description
        - price
        - location
delete_permissions:
  - role: host
    permission:
      filter:
        host_id:
          _eq: x-hasura-user-id
