table:
  schema: safetrust
  name: pricing_rules
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - rule_name
        - rule_type
        - token
        - base_amount
        - percentage
        - min_amount
        - max_amount
        - priority
        - is_active
        - created_at
      filter:
        is_active:
          _eq: true
      comment: "Users can view active pricing rules"
  - role: host
    permission:
      columns:
        - id
        - rule_name
        - rule_type
        - token
        - base_amount
        - percentage
        - min_amount
        - max_amount
        - priority
        - is_active
        - created_at
      filter:
        is_active:
          _eq: true
      comment: "Hosts can view active pricing rules"
  - role: admin
    permission:
      columns: "*"
      filter: {}
      comment: "Admins can view all pricing rules"
insert_permissions:
  - role: admin
    permission:
      check: {}
      columns:
        - rule_name
        - rule_type
        - token
        - base_amount
        - percentage
        - min_amount
        - max_amount
        - priority
        - is_active
      comment: "Admins can create pricing rules"
update_permissions:
  - role: admin
    permission:
      columns:
        - rule_name
        - rule_type
        - token
        - base_amount
        - percentage
        - min_amount
        - max_amount
        - priority
        - is_active
      filter: {}
      check: {}
      comment: "Admins can update pricing rules"
delete_permissions:
  - role: admin
    permission:
      filter: {}
      comment: "Admins can delete pricing rules"
