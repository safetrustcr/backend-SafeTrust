table:
  name: bid_requests
  schema: safetrust
object_relationships:
  - name: apartment
    using:
      foreign_key_constraint_on: apartment_id
  - name: tenant
    using:
      foreign_key_constraint_on: tenant_id
array_relationships:
  - name: bid_status_histories
    using:
      foreign_key_constraint_on:
        column: bid_request_id
        table:
          name: bid_status_histories
          schema: safetrust
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - apartment_id
        - tenant_id
        - current_status
        - proposed_price
        - desired_move_in
        - created_at
        - updated_at
      filter:
        tenant_id:
          _eq: X-Hasura-User-Id
      comment: "Guests can view their own offers"
  - role: host
    permission:
      columns:
        - id
        - apartment_id
        - tenant_id
        - current_status
        - proposed_price
        - desired_move_in
        - created_at
        - updated_at
      filter:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      comment: "Hosts can view offers for their own apartments"
  - role: admin
    permission:
      columns: "*"
      filter: {}
insert_permissions:
  - role: guest
    permission:
      check:
        tenant_id:
          _eq: X-Hasura-User-Id
      columns:
        - apartment_id
        - proposed_price
        - desired_move_in
      set:
        tenant_id: X-Hasura-User-Id
      comment: "Guests can create offers as themselves"
  - role: admin
    permission:
      check: {}
      columns:
        - apartment_id
        - tenant_id
        - proposed_price
        - desired_move_in
        - current_status
update_permissions:
  - role: guest
    permission:
      columns:
        - proposed_price
        - desired_move_in
      filter:
        _and:
          - tenant_id:
              _eq: X-Hasura-User-Id
          - current_status:
              _in: ["PENDING", "VIEWED"]
      check:
        tenant_id:
          _eq: X-Hasura-User-Id
      comment: "Guests can update their own pending offers"
  - role: host
    permission:
      columns:
        - current_status
      filter:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      check:
        apartment:
          owner_id:
            _eq: X-Hasura-User-Id
      comment: "Hosts can update the status of offers for their apartments"
  - role: admin
    permission:
      columns:
        - current_status
      filter: {}
      check: {}
delete_permissions:
  - role: guest
    permission:
      filter:
        _and:
          - tenant_id:
              _eq: X-Hasura-User-Id
          - current_status:
              _eq: "CANCELLED"
      comment: "Guests can delete their own cancelled offers"
  - role: admin
    permission:
      filter: {}
