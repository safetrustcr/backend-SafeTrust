table:
  name: user_wallets
  schema: safetrust
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - user_id
        - wallet_address
        - chain_type
        - is_primary
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      comment: "Guests can only see their own wallets"
  - role: host
    permission:
      columns:
        - id
        - user_id
        - wallet_address
        - chain_type
        - is_primary
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      comment: "Hosts can only see their own wallets"
