table:
  name: messages
  schema: hotel_industry
object_relationships:
  - name: conversation
    using:
      foreign_key_constraint_on: conversation_id
  - name: sender
    using:
      foreign_key_constraint_on: sender_id
  - name: forwarded_from
    using:
      foreign_key_constraint_on: forwarded_from_id

select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - conversation_id
        - sender_id
        - body
        - created_at
        - read_at
      filter:
        conversation:
          _or:
            - guest_id:
                _eq: X-Hasura-User-Id
            - host_id:
                _eq: X-Hasura-User-Id
  - role: host
    permission:
      columns:
        - id
        - conversation_id
        - sender_id
        - body
        - created_at
        - read_at
      filter:
        conversation:
          _or:
            - guest_id:
                _eq: X-Hasura-User-Id
            - host_id:
                _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}

insert_permissions:
  - role: guest
    permission:
      check:
        conversation:
          _or:
            - guest_id:
                _eq: X-Hasura-User-Id
            - host_id:
                _eq: X-Hasura-User-Id
      set:
        sender_id: X-Hasura-User-Id
        tenant_id: X-Hasura-Tenant-Id
      columns:
        - conversation_id
        - body
  - role: host
    permission:
      check:
        conversation:
          _or:
            - guest_id:
                _eq: X-Hasura-User-Id
            - host_id:
                _eq: X-Hasura-User-Id
      set:
        sender_id: X-Hasura-User-Id
        tenant_id: X-Hasura-Tenant-Id
      columns:
        - conversation_id
        - body

update_permissions:
  - role: guest
    permission:
      columns:
        - read_at
      filter:
        _and:
          - sender_id:
              _neq: X-Hasura-User-Id
          - conversation:
              _or:
                - guest_id:
                    _eq: X-Hasura-User-Id
                - host_id:
                    _eq: X-Hasura-User-Id
  - role: host
    permission:
      columns:
        - read_at
      filter:
        _and:
          - sender_id:
              _neq: X-Hasura-User-Id
          - conversation:
              _or:
                - guest_id:
                    _eq: X-Hasura-User-Id
                - host_id:
                    _eq: X-Hasura-User-Id

delete_permissions:
  - role: admin
    permission:
      filter: {}
