table:
  name: reservations
  schema: hotel_industry
configuration:
  custom_name: hotel_reservations
  column_config:
    room_id:
      custom_name: roomId
    wallet_address:
      custom_name: walletAddress
    reservation_id:
      custom_name: reservationId
    reservation_status:
      custom_name: reservationStatus
    total_amount:
      custom_name: totalAmount
    created_at:
      custom_name: createdAt
    updated_at:
      custom_name: updatedAt
object_relationships:
  - name: room
    using:
      foreign_key_constraint_on: room_id