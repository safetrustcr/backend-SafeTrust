table:
  name: hotel_members
  schema: hotel_industry
object_relationships:
  - name: hotel
    using:
      foreign_key_constraint_on: hotel_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - hotel_id
        - user_id
        - role
        - created_at
      filter:
        user_id:
          _eq: x-hasura-user-id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - user_id:
              _eq: x-hasura-user-id
          - role:
              _eq: OWNER
      columns:
        - hotel_id
        - user_id
        - role
