table:
  name: rooms
  schema: hotel_industry
object_relationships:
  - name: hotel
    using:
      foreign_key_constraint_on: hotel_id
  - name: room_type
    using:
      foreign_key_constraint_on: room_type_id
array_relationships:
  - name: room_images
    using:
      foreign_key_constraint_on:
        table:
          schema: hotel_industry
          name: room_images
        column: room_id
  - name: reservations
    using:
      foreign_key_constraint_on:
        table:
          schema: hotel_industry
          name: reservations
        column: room_id
update_permissions:
  - role: user
    permission:
      columns:
        - room_number
        - room_type_id
        - price_night
        - capacity
        - is_active
      filter:
        hotel:
          members:
            user_id:
              _eq: x-hasura-user-id
            role:
              _in:
                - OWNER
                - MANAGER
      check:
        hotel:
          members:
            user_id:
              _eq: x-hasura-user-id
            role:
              _in:
                - OWNER
                - MANAGER
