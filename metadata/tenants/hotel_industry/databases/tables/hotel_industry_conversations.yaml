# hotel_industry tables have no tenant_id column: the schema is the tenant
# boundary (its own Hasura source), and rows are scoped to participants.
table:
  name: conversations
  schema: hotel_industry
object_relationships:
  - name: reservation
    using:
      foreign_key_constraint_on: reservation_id
  - name: host
    using:
      foreign_key_constraint_on: host_id
  - name: guest
    using:
      foreign_key_constraint_on: guest_id

select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - reservation_id
        - guest_id
        - host_id
        - status
        - last_message_at
        - created_at
      filter:
        _or:
          - guest_id:
              _eq: X-Hasura-User-Id
          - host_id:
              _eq: X-Hasura-User-Id
  - role: host
    permission:
      columns:
        - id
        - reservation_id
        - guest_id
        - host_id
        - status
        - last_message_at
        - created_at
      filter:
        _or:
          - guest_id:
              _eq: X-Hasura-User-Id
          - host_id:
              _eq: X-Hasura-User-Id
  - role: admin
    permission:
      columns: "*"
      filter: {}

insert_permissions:
  - role: guest
    permission:
      check:
        guest_id:
          _eq: X-Hasura-User-Id
      set:
        guest_id: X-Hasura-User-Id
      columns:
        - reservation_id
        - host_id
  - role: host
    permission:
      check:
        host_id:
          _eq: X-Hasura-User-Id
      set:
        host_id: X-Hasura-User-Id
      columns:
        - reservation_id
        - guest_id

update_permissions:
  - role: guest
    permission:
      columns:
        - last_message_at
        - status
      filter:
        guest_id:
          _eq: X-Hasura-User-Id
  - role: host
    permission:
      columns:
        - last_message_at
        - status
      filter:
        host_id:
          _eq: X-Hasura-User-Id

delete_permissions:
  - role: admin
    permission:
      filter: {}
