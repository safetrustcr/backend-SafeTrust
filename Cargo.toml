[workspace]
resolver = "2"
members = [
    "crates/webhook-verifier",
    "crates/stellar-utils",
    "crates/chunk-processor",
    "crates/pg-bulk-upsert",
    "crates/x402-processor",
    "crates/escrow-state-machine",
]

[workspace.dependencies]
neon       = { version = "0.10", default-features = false, features = ["napi-6"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", features = ["json"] }
hex        = "0.4"
base64     = "0.22"
