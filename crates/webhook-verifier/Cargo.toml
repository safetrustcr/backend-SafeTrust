[package]
name = "webhook-verifier"
version = "0.1.0"
edition = "2021"
description = "Neon native addon for TrustlessWork HMAC-SHA256 webhook verification"

[lib]
crate-type = ["cdylib"]

[dependencies]
neon = { version = "1", default-features = false, features = ["napi-6"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
constant_time_eq = "0.3"
ed25519-dalek = "2"
