[package]
name = "zk-verifier"
version = "0.1.0"
edition = "2021"
description = "Neon addon for verifying SafeTrust Noir UltraHonk proofs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
neon = { version = "1", default-features = false, features = ["napi-6"] }

[target.'cfg(windows)'.dependencies]
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
barretenberg-rs = { version = "=5.0.0-nightly.20260522", default-features = false, features = ["native"] }
