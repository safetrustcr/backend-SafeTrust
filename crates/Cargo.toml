[package]
name = "safetrust-native-gates"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
x402-processor = ["dep:x402-processor"]

[dependencies]
x402-processor = { path = "x402-processor", optional = true }
soroban-reconciler = ["dep:soroban-reconciler"]

[dependencies]
soroban-reconciler = { path = "soroban-reconciler", optional = true }

[workspace]
resolver = "2"
members = [
    "x402-processor",
    "webhook-verifier",
    "stellar-utils",
    "chunk-processor",
    "pg-bulk-upsert",
    "escrow-state-machine",
    "soroban-reconciler",
]
# `x402-processor` is opt-in (see CRATES.md), so a bare `cargo build` builds
# only the feature-gate package.
default-members = ["."]
