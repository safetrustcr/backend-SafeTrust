[package]
name = "safetrust-native-gates"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
zk-verifier = ["dep:zk-verifier"]
x402-processor = ["dep:x402-processor"]
soroban-reconciler = ["dep:soroban-reconciler"]

[dependencies]
zk-verifier = { path = "zk-verifier", optional = true }
x402-processor = { path = "x402-processor", optional = true }
soroban-reconciler = { path = "soroban-reconciler", optional = true }

[workspace]
resolver = "2"
members = [
    "webhook-verifier",
    "zk-verifier",
    "stellar-utils",
    "chunk-processor",
    "pg-bulk-upsert",
    "x402-processor",
    "escrow-state-machine",
    "soroban-reconciler",
]
default-members = [
    "webhook-verifier",
    "stellar-utils",
    "chunk-processor",
    "pg-bulk-upsert",
    "escrow-state-machine",
]

[workspace.dependencies]
neon       = { version = "0.10", default-features = false, features = ["napi-6"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", features = ["json"] }
hex        = "0.4"
base64     = "0.22"
