[workspace]
resolver = "2"
members = [
    "webhook-verifier",
    "stellar-utils",
    "chunk-processor",
    "pg-bulk-upsert",
    "soroban-reconciler",
]

[workspace.dependencies]
neon       = { version = "0.10", default-features = false, features = ["napi-6"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
reqwest    = { version = "0.12", features = ["json"] }
hex        = "0.4"
base64     = "0.22"
