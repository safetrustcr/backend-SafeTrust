services:
  postgres:
    image: postgis/postgis:15-3.3
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - safetrust-network

  graphql-engine:
    image: hasura/graphql-engine:v2.47.0
    ports:
      - "${HASURA_PORT:-8080}:8080"
    restart: always
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: >-
        postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PG_DATABASE_URL: >-
        postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
      HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE:-false}
      HASURA_GRAPHQL_CORS_DOMAIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:4321}
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: >-
        startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?HASURA_ADMIN_SECRET must be set in .env or the environment}
      HASURA_GRAPHQL_JWT_SECRET: ${HASURA_GRAPHQL_JWT_SECRET}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://safetrust-webhook:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - safetrust-network

  webhook:
    build:
      # Repo root: webhook/Dockerfile copies its sources with repo-root paths.
      context: .
      dockerfile: webhook/Dockerfile
      # Cross-platform layer cache — works on Linux, macOS Docker Desktop,
      # and GitHub Actions (ACTIONS_CACHE_URL not required for local dev).
      # Relative path is accessible from Docker's build context on all platforms;
      # /tmp/docker-cache breaks on macOS Desktop (host /tmp ≠ VM /tmp).
      cache_from:
        - type=local,src=.docker-cache/webhook
      cache_to:
        - type=local,dest=.docker-cache/webhook,mode=max
    container_name: safetrust-webhook
    ports:
      - "${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEBHOOK_PORT:-3000}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-3000}
      # Browser origins for the API; see .env.example. Empty in development
      # allows only localhost / 127.0.0.1 origins.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-100}
      API_IP_RATE_LIMIT_MAX: ${API_IP_RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_IP_RATE_LIMIT_MAX: ${AUTH_IP_RATE_LIMIT_MAX:-300}
      PUBLIC_RATE_LIMIT_WINDOW_MS: ${PUBLIC_RATE_LIMIT_WINDOW_MS:-900000}
      PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-60}
      HEALTH_RATE_LIMIT_WINDOW_MS: ${HEALTH_RATE_LIMIT_WINDOW_MS:-900000}
      HEALTH_RATE_LIMIT_MAX: ${HEALTH_RATE_LIMIT_MAX:-600}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?HASURA_ADMIN_SECRET must be set in .env or the environment}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      HASURA_GRAPHQL_ENDPOINT: >-
        http://graphql-engine:8080/v1/graphql
      TRUSTLESSWORK_API_URL: ${TRUSTLESSWORK_API_URL:-https://dev.api.trustlesswork.com}
      TRUSTLESSWORK_API_KEY: ${TRUSTLESSWORK_API_KEY}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      X402_ENABLED: ${X402_ENABLED:-false}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-}
      X402_FACILITATOR_API_KEY: ${X402_FACILITATOR_API_KEY:-}
      SAFETRUST_PLATFORM_WALLET: ${SAFETRUST_PLATFORM_WALLET:-G_YOUR_PLATFORM_WALLET_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBHOOK_PORT:-3000}/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - safetrust-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  safetrust-network:
    driver: bridge
