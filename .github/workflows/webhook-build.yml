# Builds the webhook Docker image and smoke-tests, inside the container, the
# x402-processor Neon addon and the TypeScript modules that replaced the other
# Rust addons (Stellar wallet checks, HMAC verification, escrow transitions).
#
# This is the verification that requires Docker (Debian bookworm glibc
# toolchain + cargo build, matching the node:24-bookworm-slim image), so it runs
# for free on GitHub runners instead of locally.
# A failing build or a broken module will show up directly on the PR.
name: webhook build

on:
  push:
    paths:
      - 'webhook/src/**'
      - 'webhook/tsconfig*.json'
      - 'webhook/package*.json'
      - 'webhook/Dockerfile'
      # Copied into the image and compiled by the crates tsconfig, so a change
      # here must rebuild CI even though it lives outside webhook/.
      - 'tsconfig.crates.json'
      - 'crates/**'
      - 'tests/karate/**'
      - '.github/workflows/webhook-build.yml'
  pull_request:
    paths:
      - 'webhook/src/**'
      - 'webhook/tsconfig*.json'
      - 'webhook/package*.json'
      - 'webhook/Dockerfile'
      - 'tsconfig.crates.json'
      - 'crates/**'
      - 'tests/karate/**'
      - '.github/workflows/webhook-build.yml'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Injected from the repository secret store at run time. Never commit a
      # value and never pass it as a Docker build arg, which would bake it into
      # the image.
      HASURA_ADMIN_SECRET: ${{ secrets.HASURA_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build webhook image
        run: docker build -t safetrust-webhook:verify -f webhook/Dockerfile .

      # Runs the compiled dist/ modules with the production node_modules, so it
      # also proves Node 24 can require() the ESM-only dependencies of
      # @stellar/stellar-sdk (Jest transpiles those, the runtime does not).
      - name: Smoke-test the image's native addon and TypeScript replacements
        run: |
          docker run --rm -i -w /app/webhook safetrust-webhook:verify node - <<'EOF'
          const fs = require('node:fs');
          const x402 = require('/app/crates/x402-processor');
          const wallet = require('./dist/lib/stellar-wallet');
          const hmac = require('./dist/lib/hmac-signature');
          const escrow = require('./dist/lib/escrow-transitions');
          const good = 'GDVEU3DD4KOFECV66VIHWEZOYX4ZKR3WV27L464SIIPOU2IUI3JCZA57';
          // ed25519 signature of 'Hello, SafeTrust!' by seed [7u8; 32], from the former Rust crate.
          const sig = '1eea5b08a29d119057e2b1ef77e0e9f95f0876664d0e42062788fdc1f5a9a682ca1a74fd425bd780f5058dd0f6f7a12362136505fb8f2ae8fecdd4306148560e';
          const checks = {
            x402Exports: typeof x402.validateX402Payment === 'function' && typeof x402.buildPaymentRequirement === 'function',
            onlyX402Remains: fs.readdirSync('/app/crates').join(',') === 'x402-processor',
            validAddress: wallet.isStellarAccountAddress(good) === true,
            badChecksum: wallet.isStellarAccountAddress('GDQERENWDDSQZS7R7WQZKGESDRXL525W65XHIVZO4QPQCHRILIUQ2J7Z') === false,
            signature: wallet.verifyStellarEd25519('Hello, SafeTrust!', sig, good) === true,
            tampered: wallet.verifyStellarEd25519('Hello, SafeTrust?', sig, good) === false,
            hmac: hmac.verifyHmacSignature(
              Buffer.from('{"contractId":"escrow-1","status":"funded"}'),
              'sha256=e258ba1e4532f7ffcb94438be44e8a3671a24988a212b0144ba43fc65fae836a',
              'dev-secret'
            ) === true,
            legalTransition: escrow.validateTransition('created', 'funded', 'escrow.funded') === true,
            illegalTransition: escrow.validateTransition('completed', 'created', 'escrow.initialized') === false,
            priorStates: JSON.stringify(escrow.getValidPriorStates('funded', 'escrow.funded')) === '["created","pending_funding"]',
            noPriorStates: (() => {
              try { escrow.getValidPriorStates('completed', 'dispute.raised'); return false; }
              catch (e) { return /No valid prior states/.test(e.message); }
            })(),
          };
          const failed = Object.keys(checks).filter((name) => !checks[name]);
          if (failed.length > 0) {
            console.error('image smoke test FAILED:', failed);
            process.exit(1);
          }
          console.log('image smoke test OK:', Object.keys(checks).join(', '));
          EOF

  webhook-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webhook/package-lock.json

      - name: Install webhook dependencies
        run: npm ci --ignore-scripts --prefix webhook

      - name: Type-check webhook and tests
        run: npm --prefix webhook run type-check

      - name: Run reconciliation and ported-crate tests
        working-directory: webhook
        run: >-
          npx jest --runInBand --runTestsByPath
          src/lib/__tests__/reconciliation.test.ts
          src/lib/source-adapters/__tests__/tw.adapter.test.ts
          src/lib/source-adapters/__tests__/tw-indexer.normalize.test.ts
          src/repositories/__tests__/reconciliation.repository.test.ts
          src/services/__tests__/reconciliation.service.test.ts
          src/routes/reconciliation/__tests__/sync-escrows.handler.test.ts
          src/lib/__tests__/escrow-state-machine.test.ts
          src/lib/__tests__/stellar-wallet.test.ts
          src/lib/__tests__/hmac-signature.test.ts

  cargo-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}

      - name: Run workspace unit tests
        run: cargo test --workspace
        working-directory: crates

  # TypeScript gate for the webhook service: `npm run type-check` plus the Jest
  # suite. Both steps fail the build on any type error or test failure.
  #
  # Test database strategy: the suite needs no PostgreSQL service or fixture
  # database. Every test that touches the database mocks its I/O boundary
  # instead — services/db, services/hasura, and Node's https module are replaced
  # with jest.mock factories — so Jest runs entirely in-process under
  # testEnvironment: node and never opens a connection.
  #
  # x402-processor is the only remaining Neon addon. Its Jest suite loads the
  # compiled binary, so this job builds it before running Jest; the x402
  # middleware suite injects a fake through the exported test seam.
  webhook-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webhook/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('crates/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci --ignore-scripts
        working-directory: webhook

      - name: Build the x402-processor addon used by the Jest suite
        run: |
          cargo build --release --manifest-path crates/Cargo.toml -p x402-processor
          node crates/scripts/copy-native.js --crate=x402-processor
          cargo build --release --manifest-path crates/Cargo.toml \
            -p webhook-verifier -p escrow-state-machine \
            -p stellar-utils -p soroban-reconciler
          for addon in webhook-verifier escrow-state-machine stellar-utils soroban-reconciler; do
            node crates/scripts/copy-native.js --crate="$addon"
          done

      - name: Type-check
        run: npm --prefix webhook run type-check

      - name: Run Jest suite
        run: npm --prefix webhook run test:ci