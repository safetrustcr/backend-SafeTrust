# Builds the webhook Docker image and smoke-tests the running service.
#
# This is the verification that requires Docker, so it runs on GitHub runners.
# A failing build or a broken addon will show up directly on the PR.
name: webhook build

on:
  push:
    paths:
      - 'webhook/src/**'
      - 'webhook/tsconfig*.json'
      - 'webhook/package*.json'
      - 'webhook/Dockerfile'
      - 'tests/karate/**'
      - '.github/workflows/webhook-build.yml'
  pull_request:
    paths:
      - 'webhook/src/**'
      - 'webhook/tsconfig*.json'
      - 'webhook/package*.json'
      - 'webhook/Dockerfile'
      - 'tests/karate/**'
      - '.github/workflows/webhook-build.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Injected from the repository secret store at run time. Never commit a
      # value and never pass it as a Docker build arg, which would bake it into
      # the image.
      HASURA_ADMIN_SECRET: ${{ secrets.HASURA_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build webhook image
        run: docker build -t safetrust-webhook:verify -f webhook/Dockerfile .

      - name: Smoke-test running service
        run: |
          docker run -d --name safetrust-webhook-verify -p 3001:3001 safetrust-webhook:verify
          for attempt in $(seq 1 30); do
            curl --fail http://localhost:3001/health/live && exit 0
            sleep 1
          done
          docker logs safetrust-webhook-verify
          exit 1

  webhook-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webhook/package-lock.json

      - name: Install webhook dependencies
        run: npm ci --prefix webhook

      - name: Type-check webhook and tests
        run: npm --prefix webhook run type-check

      - name: Run reconciliation tests
        working-directory: webhook
        run: >-
          npm run test:ci --
          --runTestsByPath
          src/lib/__tests__/reconciliation.test.ts
          src/lib/__tests__/reconciliation-parallel.test.ts
          src/lib/__tests__/reconciliation-bulk.test.ts
          src/lib/native-adapters/__tests__/rust-chunk.adapter.test.ts
          src/lib/native-adapters/__tests__/rust-upsert.adapter.test.ts
          src/lib/source-adapters/__tests__/soroban.adapter.test.ts
          src/lib/source-adapters/__tests__/tw.adapter.test.ts
          src/repositories/__tests__/reconciliation.repository.test.ts
          src/services/__tests__/reconciliation.service.test.ts
          src/routes/reconciliation/__tests__/sync-escrows.handler.test.ts

  # TypeScript gate for the webhook service: `npm run type-check` plus the Jest
  # suite. Both steps fail the build on any type error or test failure.
  #
  # Test database strategy: the suite needs no PostgreSQL service or fixture
  # database. Every test that touches the database mocks its I/O boundary
  # instead — services/db, services/hasura, and Node's https module are replaced
  # with jest.mock factories — so Jest runs entirely in-process under
  # testEnvironment: node and never opens a connection.
  #
  # The Jest suites run directly against the TypeScript webhook service.
  webhook-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webhook/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: webhook

      - name: Type-check
        run: npm --prefix webhook run type-check

      - name: Run Jest suite
        run: npm --prefix webhook run test:ci
