# Builds the webhook Docker image and smoke-tests the Rust Neon addons
# (stellar-utils, webhook-verifier, escrow-state-machine) inside the container.
#
# This is the verification that requires Docker (Debian bookworm glibc
# toolchain + cargo build, matching the node:24-bookworm-slim image), so it runs
# for free on GitHub runners instead of locally.
# A failing build or a broken addon will show up directly on the PR.
name: webhook build

on:
  push:
    paths:
      - 'webhook/src/**'
      - 'webhook/tsconfig*.json'
      - 'webhook/package*.json'
      - 'webhook/Dockerfile'
      # Copied into the image and compiled by the crates tsconfig, so a change
      # here must rebuild CI even though it lives outside webhook/.
      - 'tsconfig.crates.json'
      - 'crates/**'
      - 'tests/karate/**'
      - '.github/workflows/webhook-build.yml'
  pull_request:
    paths:
      - 'webhook/src/**'
      - 'webhook/tsconfig*.json'
      - 'webhook/package*.json'
      - 'webhook/Dockerfile'
      - 'tsconfig.crates.json'
      - 'crates/**'
      - 'tests/karate/**'
      - '.github/workflows/webhook-build.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Injected from the repository secret store at run time. Never commit a
      # value and never pass it as a Docker build arg, which would bake it into
      # the image.
      HASURA_ADMIN_SECRET: ${{ secrets.HASURA_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build webhook image
        run: docker build -t safetrust-webhook:verify -f webhook/Dockerfile .

      - name: Smoke-test native addons inside the image
        run: |
          docker run --rm safetrust-webhook:verify node -e "
            const stellar = require('/app/crates/stellar-utils');
            const verifier = require('/app/crates/webhook-verifier');
            const escrow = require('/app/crates/escrow-state-machine');
            const good = 'GDVEU3DD4KOFECV66VIHWEZOYX4ZKR3WV27L464SIIPOU2IUI3JCZA57';
            const checks = [
              stellar.validateStellarAddress(good) === true,
              stellar.validateStellarAddress('not-a-stellar-address') === false,
              stellar.validateStellarAddress('GDQERENWDDSQZS7R7WQZKGESDRXL525W65XHIVZO4QPQCHRILIUQ2J7Z') === false,
              Object.keys(stellar).sort().join(',') === 'validateStellarAddress,verifyStellarEd25519',
              typeof verifier.verifyHmacSignature === 'function',
              typeof verifier.validateStellarAddress === 'function',
              typeof escrow.validateTransition === 'function',
              typeof escrow.getValidPriorStates === 'function',
              typeof escrow.getTransitionTable === 'function',
              escrow.validateTransition('created', 'funded', 'escrow.funded') === true,
              escrow.validateTransition('completed', 'created', 'escrow.initialized') === false,
              escrow.getValidPriorStates('funded', 'escrow.funded') === '[\"created\",\"pending_funding\"]',
              (() => { try { escrow.getValidPriorStates('completed', 'dispute.raised'); return false; } catch (e) { return /No valid prior states/.test(e.message); } })()
            ];
            if (checks.includes(false)) {
              console.error('addon smoke test FAILED:', checks);
              process.exit(1);
            }
            console.log('addon smoke test OK - exports and validation behave as expected');
          "

  cargo-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}

      - name: Run workspace unit tests
        run: cargo test --workspace
        working-directory: crates

  # TypeScript gate for the webhook service: `npm run type-check` plus the Jest
  # suite. Both steps fail the build on any type error or test failure.
  #
  # Test database strategy: the suite needs no PostgreSQL service or fixture
  # database. Every test that touches the database mocks its I/O boundary
  # instead — services/db, services/hasura, and Node's https module are replaced
  # with jest.mock factories — so Jest runs entirely in-process under
  # testEnvironment: node and never opens a connection.
  #
  # The five suites that exercise the Neon addons (webhook-verifier,
  # escrow-state-machine, x402-processor, stellar-utils) load the compiled
  # binaries, so this job builds those addons before running Jest. The other
  # addon-backed suites inject a fake through the exported test seam and never
  # load a binary.
  webhook-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webhook/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: crates/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('crates/Cargo.lock') }}

      - name: Install Node dependencies
        run: npm ci
        working-directory: webhook

      - name: Build native addons used by the Jest suite
        run: |
          cargo build --release --manifest-path crates/Cargo.toml \
            -p webhook-verifier -p escrow-state-machine -p x402-processor -p stellar-utils
          for addon in webhook-verifier escrow-state-machine x402-processor stellar-utils; do
            node crates/scripts/copy-native.js --crate="$addon"
          done

      - name: Type-check
        run: npm --prefix webhook run type-check

      - name: Run Jest suite
        run: npm --prefix webhook test -- --runInBand