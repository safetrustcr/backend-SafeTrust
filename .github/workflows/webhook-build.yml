# Builds the webhook Docker image and smoke-tests the Rust stellar-utils
# Neon addon inside the container.
#
# This is the verification that requires Docker (alpine musl toolchain +
# cargo build), so it runs for free on GitHub runners instead of locally.
# A failing build or a broken addon will show up directly on the PR.
name: webhook build

on:
  push:
    paths:
      - 'webhook/**'
      - '.github/workflows/webhook-build.yml'
  pull_request:
    paths:
      - 'webhook/**'
      - '.github/workflows/webhook-build.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build webhook image
        run: docker build -t safetrust-webhook:verify webhook

      - name: Smoke-test stellar-utils addon inside the image
        run: |
          docker run --rm safetrust-webhook:verify node -e "
            const m = require('/app/crates/stellar-utils');
            const good = 'GDVEU3DD4KOFECV66VIHWEZOYX4ZKR3WV27L464SIIPOU2IUI3JCZA57';
            const checks = [
              m.validateStellarAddress(good) === true,
              m.validateStellarAddress('not-a-stellar-address') === false,
              m.validateStellarAddress('GDQERENWDDSQZS7R7WQZKGESDRXL525W65XHIVZO4QPQCHRILIUQ2J7Z') === false,
              Object.keys(m).sort().join(',') === 'validateStellarAddress,verifyStellarEd25519'
            ];
            if (checks.includes(false)) {
              console.error('addon smoke test FAILED:', checks);
              process.exit(1);
            }
            console.log('addon smoke test OK - exports and validation behave as expected');
          "
