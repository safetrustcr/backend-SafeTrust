name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - 'tests/**'
      - 'migrations/**'
      - 'metadata/**'
      - 'webhook/**'
      - 'Dockerfile'
      - 'docker-compose-test.yml'
      - 'Dockerfile.test'
      - 'bin/test'
      - 'bin/prepare-test-db'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - 'tests/**'
      - 'migrations/**'
      - 'metadata/**'
      - 'webhook/**'
      - 'Dockerfile'
      - 'docker-compose-test.yml'
      - 'Dockerfile.test'
      - 'bin/test'
      - 'bin/prepare-test-db'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  integration-tests:
    name: Karate & Analytics Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run Karate integration tests (local Docker Compose)
        run: |
          chmod +x bin/test bin/prepare-test-db
          ./bin/test

      - name: Upload Karate Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: karate-test-reports
          path: tests/results/
          if-no-files-found: ignore

  docs-link-check:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository-relative Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress README.md '*.md' 'docs/**/*.md'
          fail: true
