# Runs metadata/deploy-tenant.sh against a mock Hasura server.
#
# The tests need no Docker or Hasura instance: a stateful Python mock implements
# the metadata/GraphQL endpoints, and a stub hasura CLI reports migration status.
# They cover complete metadata application, re-deploy drift, failed API
# responses, multi-tenant preservation, migration validation, inconsistent
# metadata, role verification, and Cloud target guards.
name: metadata deploy tests

on:
  push:
    paths:
      - 'metadata/**'
      - 'migrations/**'
      - 'bin/test-metadata'
      - 'tests/metadata/**'
      - '.github/workflows/metadata-deploy.yml'
  pull_request:
    paths:
      - 'metadata/**'
      - 'migrations/**'
      - 'bin/test-metadata'
      - 'tests/metadata/**'
      - '.github/workflows/metadata-deploy.yml'

jobs:
  metadata-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mikefarah yq
        run: |
          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run metadata deployment tests
        run: bin/test-metadata
