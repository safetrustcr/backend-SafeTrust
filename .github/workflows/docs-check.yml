name: Docs Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/docs-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: Verify Docs Index & Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check docs index and relative links
        run: node scripts/check-docs.mjs
