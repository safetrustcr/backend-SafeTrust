name: Docs Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/docs-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-docs.mjs'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: Verify Docs Index & Links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check docs index and relative links
        run: node scripts/check-docs.mjs
