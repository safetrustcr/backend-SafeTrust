[package]
name    = "soroban-reconciler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neon       = { version = "0.10", default-features = false, features = ["napi-6"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq       = { version = "2.12", features = ["json"] }
