# File-backed secrets — copy to docker-compose.secrets.yml (git-ignored):
#
#   mkdir -p secrets
#   sudo install -m 0400 -o 1000 -g 1000 /secure/path/firebase_private_key secrets/firebase_private_key
#   sudo install -m 0400 -o 1000 -g 1000 /secure/path/trustlesswork_api_key secrets/trustlesswork_api_key
#   sudo install -m 0400 -o 1000 -g 1000 /secure/path/webhook_db_password secrets/webhook_db_password
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Compose mounts a file secret as a bind mount, so the host file's ownership and
# mode are what the container sees. The webhook runtime user is UID/GID 1000
# (`node` in webhook/Dockerfile), hence `-o 1000 -g 1000` above: root-owned 0400
# files are unreadable to that user and the webhook refuses to start. If the
# files already exist, `sudo chown 1000:1000 secrets/*` gives the same result.
#
# Each file is mounted read-only at /run/secrets/<name>; the webhook reads it
# through the matching *_FILE variable, so the value never appears in
# `docker inspect` or in the environment of every process. The plain variables
# are blanked here so only the files are used.
#
# SCOPE: this keeps the three secrets out of the *webhook* container's
# environment. The base Compose file still passes WEBHOOK_DB_PASSWORD to the
# postgres service, because 01-init-roles.sh needs it to set the webhook role's
# password, so that value remains part of the Postgres container's configuration.
# Deployment-wide secrecy would also require file-backed role-password
# initialization in Postgres.
services:
  webhook:
    secrets:
      - firebase_private_key
      - trustlesswork_api_key
      - webhook_db_password
    environment:
      FIREBASE_PRIVATE_KEY: ""
      FIREBASE_PRIVATE_KEY_FILE: /run/secrets/firebase_private_key
      # The code accepts both spellings of the TrustlessWork key.
      TRUSTLESSWORK_API_KEY: ""
      TRUSTLESSWORK_API_KEY_FILE: /run/secrets/trustlesswork_api_key
      TRUSTLESS_WORK_API_KEY: ""
      TRUSTLESS_WORK_API_KEY_FILE: /run/secrets/trustlesswork_api_key
      # The official Postgres image supports POSTGRES_PASSWORD_FILE too; the
      # webhook only needs its own least-privilege role password.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/webhook_db_password

secrets:
  firebase_private_key:
    file: ./secrets/firebase_private_key
  trustlesswork_api_key:
    file: ./secrets/trustlesswork_api_key
  webhook_db_password:
    file: ./secrets/webhook_db_password
